schema_version: "1.0"
name: pr1-workshop-scope
description: A workshop's own context reaches only the agents sent into that workshop.
tags: [scaffold]
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Skill, Agent, Bash, Read, Glob, Grep]
  prompt: |
    This folder holds FlightDeck workshops. Use the team-plans skill to find the scout's opening text and the scope command. Send one flight:scout agent to work in workshop scope-a: its opening text is the scout seat's text with the output of the scope command for scope-a pasted where the page says. Ask the scout: What is the scope word for this workshop? Reply with the scout's answer word for word.
runs: 3
graders:
  - type: regex
    name: word-a
    pattern: "KESTREL-4"
    match: contains
  - type: regex
    name: no-word-b
    pattern: "OSPREY-9"
    match: not_contains
  - type: tool_used
    name: sent-scout
    tool: Agent
    min: 1
  - type: llm
    name: own-only
    criteria: "Passes only if the answer reports the scope word KESTREL-4 as the scout's answer for workshop scope-a, never mentions OSPREY-9, and the main session sent a scout whose opening text included workshop scope-a's own block (the output of the scope command)."
